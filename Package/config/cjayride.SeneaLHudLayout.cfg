## Settings file was created by plugin SeneaL HUD Layout v1.1.82
## Plugin GUID: cjayride.SeneaLHudLayout

[BossBar]

## Pixels to move boss health bars. Positive moves up. Regular enemy bars stay where SeneaL UI put them.
# Setting type: Single
# Default value: 40
# Acceptable value range: From -2000 to 2000
OffsetY = 74.07

[CenterMessage]

## Pixels between the slain / biome banner and whatever is above it: the compass, or the boss bar when one is showing.
# Setting type: Single
# Default value: 47
# Acceptable value range: From 0 to 400
Gap = 47

## Size of the large middle-of-screen message. 1 is SeneaL's size.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0.4 to 2.5
Scale = 0.5

## Send that large middle message into SeneaL's notification feed or capsules instead of the banner. Uses whatever [Notifications] Style is set to in SeneaL UI.
# Setting type: Boolean
# Default value: false
SendToNotices = false

[Character]

## Show your SkillsReworked level in the top left of the character window (Skills, Texts, Trophies, and PvP).
# Setting type: Boolean
# Default value: true
ShowLevelCharacterWindow = true

## Show a Talents button beside that character-window level. It opens TalentTree. Needs TalentTree installed.
# Setting type: Boolean
# Default value: true
ShowTalentsButton = true

## Show a 100 pixel SkillsReworked XP bar under that character-window level.
# Setting type: Boolean
# Default value: true
ShowLevelXpBar = true

## Let you spend points again in a skill that lost a partial level on death, such as Tenacity going from 30 to 29.1. Fractional levels are rounded down when the Skills window opens. Only works when both Smoothbrain Tenacity and SkillsReworked are installed. Otherwise it does nothing.
# Setting type: Boolean
# Default value: true
FixSkillRespendAfterDeath = true

## Show your SkillsReworked level directly under the food timers.
# Setting type: Boolean
# Default value: true
ShowLevelFoodBar = true

## Horizontal nudge for that food-bar level, in pixels. Positive moves right. Longer levels grow to the right.
# Setting type: Single
# Default value: -39
# Acceptable value range: From -200 to 200
ShowLevelFoodBarOffsetX = -39.18

## Vertical nudge for that food-bar level, in pixels. Positive moves up.
# Setting type: Single
# Default value: -20.4
# Acceptable value range: From -200 to 200
ShowLevelFoodBarOffsetY = -20.44

[Chat]

## Hide SeneaL UI's chat window. Chat messages still exist for another chat mod, such as Chatter.
# Setting type: Boolean
# Default value: true
HideChat = true

[Compass]

## Pixels between the top of the screen and the compass. The hotbar and action slots never move it.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 0 to 800
Top = 8

[Crafting]

## Show an Items button on the crafting panel. It opens VNEI's full item search. The same button then says Close.
# Setting type: Boolean
# Default value: true
ShowItemSearch = true

## In the crafting window, click a requirement that is crafted at this same station to open its recipe. Back returns to the recipe you came from.
# Setting type: Boolean
# Default value: true
ClickMaterials = true

[Creature/Player HUD]

## Show current/max health on creature and player nameplates. Order is name, health numbers, health bar, then stars.
# Setting type: Boolean
# Default value: true
ShowHealthNumbers = true

## Show the Alerted/Aware threat icons on creature nameplates. Turn off to hide them.
# Setting type: Boolean
# Default value: true
ShowThreatIcons = true

## Show SeneaL UI's gold diamonds and lines on either side of the creature name. Off hides them.
# Setting type: Boolean
# Default value: false
ShowNameplateDiamonds = false

## Size of the Alerted/Aware icons in pixels. SeneaL's own size is about 26.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 2 to 32
ThreatIconSize = 5

## Raise the Alerted/Aware icons above the creature name, in pixels.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 24
ThreatIconLift = 10

## Opacity of the Alerted/Aware icons. 1 is fully visible, 0 is invisible.
# Setting type: Single
# Default value: 0.71
# Acceptable value range: From 0 to 1
ThreatIconOpacity = 0.71

## Size of the creature or player name above the health bar. 1 is SeneaL's size.
# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0.5 to 2.5
NameTextScale = 0.75

## Size of the current/max health numbers. 1 is SeneaL's size.
# Setting type: Single
# Default value: 0.94
# Acceptable value range: From 0.5 to 2.5
HealthTextScale = 0.94

## Width of creature and player health bars. 1 is SeneaL's width. Boss bars stay the same. The health fill uses this width too.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 3
BarWidth = 1.04

## Size of each creature level star, in pixels. Every star uses this size, and it stays matched to the health bar when you move closer or farther.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 4 to 24
StarSize = 10

## Show the [Lvl:N] label under the health bar. If Creature Level and Loot Control already adds one, this toggles that label instead of drawing a second.
# Setting type: Boolean
# Default value: false
ShowEnemyLevel = false

## Font size of our own level label when CLLC is not providing one.
# Setting type: Single
# Default value: 14
# Acceptable value range: From 8 to 32
LevelSize = 14

## Hide extra nameplate lines above the creature name (CLLC affixes like Aggressive, EliteCreatures mutation lines, and empty caption boxes on some modded creatures). Keeps the main Name and health/level text.
# Setting type: Boolean
# Default value: false
HideNameplateExtras = false

[General]

## Apply the layout offsets below. Turn this off to restore SeneaL UI's own placement.
# Setting type: Boolean
# Default value: true
Enabled = true

[HealthFood]

## Raise the health, food, and guardian-power cluster so it sits above the relocated hotbar.
# Setting type: Boolean
# Default value: true
LiftAboveHotbar = true

## Extra pixels to raise the health and food cluster. Positive moves up. Applied on top of LiftAboveHotbar.
# Setting type: Single
# Default value: 28
# Acceptable value range: From -2000 to 2000
OffsetY = 28

[Hotbar]

## Move the hotbar, action slots, and food quick slots to the bottom left. They are drawn at the top left by SeneaL UI.
# Setting type: Boolean
# Default value: true
BottomLeft = true

## Pixels to leave between the bottom of that cluster and the bottom of the screen.
# Setting type: Single
# Default value: 16
# Acceptable value range: From 0 to 400
BottomMargin = 16

## Extra horizontal nudge in pixels. Positive moves right.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -2000 to 2000
OffsetX = 0

## Extra vertical nudge in pixels, after BottomLeft placement. Positive moves up.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -2000 to 2000
OffsetY = 0

[Hover]

## When hovering a Grillspett Item Drawer, show one preview slot for the stored item instead of every stack.
# Setting type: Boolean
# Default value: true
CollapseItemDrawerStacks = true

[Minimap]

## Pixels to move the minimap, wind pill, and time pill. Negative moves left.
# Setting type: Single
# Default value: -36
# Acceptable value range: From -2000 to 2000
OffsetX = -36

## Pixels to move the minimap cluster. Positive moves up.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -2000 to 2000
OffsetY = 0

## Hide the wind and day/time pills under the minimap. The biome name on the map stays.
# Setting type: Boolean
# Default value: false
HideWindAndServerDay = true

[Notices]

## Never show SeneaL UI's server-rules window when you enter a world.
# Setting type: Boolean
# Default value: true
HideServerRules = true

[Powers]

## Hide SeneaL UI's guardian-power circle and its F key. That key does not activate Passive Powers.
# Setting type: Boolean
# Default value: true
HideSenealSlot = true

## Pixels between the food column and the first Passive Powers icon, and between the two icons.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 0 to 200
Gap = 12

## Size of the Passive Powers icons, their key labels, and the shared cooldown. 1 is the current size. Smaller than 1 shrinks them.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 1.5
Scale = 1

## Extra nudge for the Passive Powers icons. Positive moves right.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -2000 to 2000
OffsetX = 0

## Extra nudge for the Passive Powers icons. Positive moves up.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -2000 to 2000
OffsetY = 0

[Slots]

## Add a soft glow around the button's own edge on the selected hotbar item and on gear equipped in the inventory window.
# Setting type: Boolean
# Default value: true
Highlight = true

## Color of that extra glow. Default is gold, FFD700.
# Setting type: Color
# Default value: FFD700FF
HighlightColor = FFD700FF

## How far that glow spreads past the button's own edge, in pixels. 0 hides it. This does not change the check mark.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 12
HighlightSize = 1.5

## Show a check mark on the selected hotbar item and on gear equipped in the inventory window.
# Setting type: Boolean
# Default value: true
CornerPip = true

## Size of that check mark, in pixels.
# Setting type: Single
# Default value: 18
# Acceptable value range: From 8 to 40
CornerPipSize = 18

## Color of that check mark. Default is a bright green.
# Setting type: Color
# Default value: 26EB47FF
CheckColor = 26EB47FF

## Fill the inside of a magic item's slot with its EpicLoot color (green, blue, purple, orange) and hide SeneaL's rarity border. The gold selected and equipped glow stays. Off restores SeneaL's border.
# Setting type: Boolean
# Default value: true
RarityFill = true

## How strong that interior color is. 0 is invisible. 1 is a solid plate under the icon.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 1
RarityFillStrength = 0.1

## Show a white seconds countdown on an item in the inventory window while it is being equipped or unequipped.
# Setting type: Boolean
# Default value: true
ShowEquipCue = true

## Also show that countdown on the hotbar or action bar, but only while armor or other worn gear is being equipped or unequipped. Switching weapons or tools does not show it.
# Setting type: Boolean
# Default value: true
ShowGearBarCue = true

[Stats]

## Place stat numbers directly beside their names, such as pierce 8. Covers item tooltips and the item window. Off keeps SeneaL's right-aligned numbers.
# Setting type: Boolean
# Default value: true
ValuesBesideLabels = true

[Status Effects]

## Move SeneaL UI's status effect list to a screen corner. Off leaves SeneaL's own placement. Compact Status Squares still replaces this list when that mod is enabled.
# Setting type: Boolean
# Default value: false
MoveToCorner = false

## Screen corner for that list. The list grows away from the corner.
# Setting type: StatusCorner
# Default value: TopLeft
# Acceptable values: TopLeft, TopRight, BottomLeft, BottomRight
Corner = TopLeft

## Horizontal distance from that corner, in pixels. Positive moves right.
# Setting type: Single
# Default value: 32
# Acceptable value range: From -2000 to 2000
OffsetX = 32

## Vertical distance from that corner, in pixels. Positive moves up.
# Setting type: Single
# Default value: -96
# Acceptable value range: From -2000 to 2000
OffsetY = -96

[Vitals]

## Keep the stamina bar visible when it is full. Off leaves SeneaL UI's normal fade.
# Setting type: Boolean
# Default value: false
AlwaysShowStamina = false

## Keep the eitr bar visible when it is full. Off leaves SeneaL UI's normal fade.
# Setting type: Boolean
# Default value: false
AlwaysShowEitr = false

## Keep the adrenaline bar visible when it is empty. Off leaves SeneaL UI's normal fade.
# Setting type: Boolean
# Default value: false
AlwaysShowAdrenaline = false

## How heavy the stamina, eitr, and adrenaline numbers look. 0 is SeneaL's own weight. 1 thickens the digits (face dilate + outline). Change it in F1 and you should see it immediately.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 1
NumberBold = 0.8

[Wallet]

## Keep the coin purse out of chest deposits. Deposit All, Deposit Similar, and Stack All never take coins from the purse. Move coins into your inventory first if you want them in a chest. Turn this off to let those buttons take the purse.
# Setting type: Boolean
# Default value: true
SplitForChest = true

